<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플 보스 파티 달력</title>
    
    <style>
        /* [Design Tokens] 전역 변수 설정 */
        :root {
            --bg-color: #1a1a24;
            --card-bg: #242432;
            --cell-bg: #2d2d3f;
            --text-color: #ffffff;
            --text-muted: #9999aa;
            --accent-color: #ffb703; 
            --border-color: #3f3f56;
            --today-bg: #3a3225;
            --schedule-bg: #4c3c9c;
            --holiday-color: #ff6b6b;
        }

        /* [Base Styles] 기본 레이아웃 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        /* [Header UI] 컨트롤러 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 15px;
        }

        .calendar-header button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-header button:hover {
            background-color: var(--border-color);
        }

        #month-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* [Responsive Wrapper] 가로 스크롤 보장 */
        .calendar-wrapper {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        /* [Grid System] 7열 달력 판넬 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, max-content);
            gap: 6px;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: max-content; 
            margin: 0 auto;
            grid-auto-rows: 140px; /* [수정] 여러 일정을 수용하기 위해 행 높이를 140px로 약간 확장 */
        }

        /* [Day Labels] 요일 칸 */
        .day-label {
            text-align: center;
            font-weight: bold;
            height: 30px;
            line-height: 30px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            min-width: 140px; /* [수정] 일정 가독성을 위해 최소 너비 확보 */
            padding: 0 10px;
            box-sizing: border-box;
        }

        .day-label:nth-child(7) { color: #5bc0be; }
        .day-label:nth-child(1) { color: var(--holiday-color); }

        /* [Calendar Cells] 개별 날짜 카드 */
        .calendar-cell {
            background-color: var(--cell-bg);
            height: 100%;
            border-radius: 5px;
            padding: 8px;
            box-sizing: border-box;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden; /* 영역 넘침 방지 */
        }

        .calendar-cell:hover {
            border-color: var(--accent-color);
        }

        .calendar-cell.empty {
            background-color: transparent;
            cursor: default;
            border: none;
        }

        .calendar-cell.today {
            background-color: var(--today-bg);
            border: 1px solid var(--accent-color);
        }

        .cell-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 15px;
        }

        .date-num {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .calendar-cell.sunday .date-num,
        .calendar-cell.holiday .date-num {
            color: var(--holiday-color);
        }

        .calendar-cell.saturday .date-num {
            color: #5bc0be;
        }

        .holiday-label {
            font-size: 0.7rem;
            color: var(--holiday-color);
            background-color: rgba(255, 107, 107, 0.15);
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* [Schedule UI] 다중 일정을 위한 컨테이너 스타일 수정 */
        .schedule-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto; /* [수정] 일정 개수가 너무 많아지면 셀 내부에서 스크롤바 작동 */
            flex-grow: 1;
            /* 스크롤바 숨기기 (디자인용) */
            -ms-overflow-style: none;
            scrollbar-width: none; 
        }
        .schedule-container::-webkit-scrollbar {
            display: none;
        }

        /* 등록된 보스 일정 뱃지 */
        .party-badge {
            background-color: var(--schedule-bg);
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 3px;
            white-space: nowrap; 
            border-left: 3px solid var(--accent-color);
            width: max-content;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* [Modal UI Styling] 모달 팝업창 */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 8px;
            background-color: var(--cell-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .form-group select option {
            background-color: var(--card-bg);
            color: white;
        }

        .form-group select optgroup {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-weight: bold;
        }

        /* [새로운 UI 스택] 모달 내부에 현재 저장된 일정 목록을 보여주는 섹션 */
        .modal-schedule-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            border-radius: 5px;
            padding: 8px;
            margin-top: 15px;
        }

        .list-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--cell-bg);
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .schedule-item:last-child {
            margin-bottom: 0;
        }

        /* 일정 개별 삭제 X 버튼 */
        .btn-item-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            padding: 0 4px;
        }
        .btn-item-delete:hover {
            color: #ff4747;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .modal-buttons button {
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        .btn-save { background-color: var(--accent-color); color: #000; }
        .btn-close { background-color: #6c757d; color: #fff; }
    </style>
</head>
<body>

    <h1>🍁 메이플 보스 파티 달력</h1>
    
    <div class="calendar-header">
        <button onclick="changeMonth(-1)">◀ 이전 달</button>
        <div id="month-display"></div>
        <button onclick="changeMonth(1)">다음 달 ▶</button>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <div class="modal" id="schedule-modal">
        <div class="modal-content">
            <h3 id="modal-date-title">일정 추가</h3>
            
            <div class="form-group">
                <label for="party-name">파티명 / 캐릭터명</label>
                <input type="text" id="party-name" placeholder="예: 본캐 고정팟, 부캐 먹자">
            </div>

            <div class="form-group">
                <label for="boss-name">목표 보스 선택</label>
                <select id="boss-name">
                    <option value="" disabled selected hidden>보스를 선택하세요</option>
                    
                    <optgroup label="최상위 레이드 (그란디스)">
                        <option value="익스트림 세렌">익스트림 세렌</option>
                        <option value="하드 세렌">하드 세렌</option>
                        <option value="노멀 세렌">노멀 세렌</option>
                        <option value="익스트림 칼로스">익스트림 칼로스</option>
                        <option value="카오스 칼로스">카오스 칼로스</option>
                        <option value="노멀 칼로스">노멀 칼로스</option>
                        <option value="이지 칼로스">이지 칼로스</option>
                        <option value="익스트림 카링">익스트림 카링</option>
                        <option value="하드 카링">하드 카링</option>
                        <option value="노멀 카링">노멀 카링</option>
                        <option value="이지 카링">이지 카링</option>
                        <option value="노말 흉성">노말 흉성</option>
                    </optgroup>

                    <optgroup label="주요 주간/월간 보스">
                        <option value="익스트림 검은 마법사">익스트림 검은 마법사</option>
                        <option value="하드 검은 마법사">하드 검은 마법사</option>
                        <option value="하드 진 힐라">하드 진 힐라</option>
                        <option value="노멀 진 힐라">노멀 진 힐라</option>
                        <option value="하드 듄켈">하드 듄켈</option>
                        <option value="노멀 듄켈">노멀 듄켈</option>
                        <option value="하드 스우">하드 스우</option>
                        <option value="노멀 스우">노멀 스우</option>
                        <option value="하드 데미안">하드 데미안</option>
                        <option value="노멀 데미안">노멀 데미안</option>
                        <option value="하드 루시드">하드 루시드</option>
                        <option value="노멀 루시드">노멀 루시드</option>
                        <option value="이지 루시드">이지 루시드</option>
                        <option value="하드 윌">하드 윌</option>
                        <option value="노멀 윌">노멀 윌</option>
                        <option value="이지 윌">이지 윌</option>
                    </optgroup>

                    <optgroup label="중하위 주간 보스">
                        <option value="카오스 가엔슬">카오스 가엔슬</option>
                        <option value="노멀 가엔슬">노멀 가엔슬</option>
                        <option value="카오스 파풀라투스">카오스 파풀라투스</option>
                        <option value="카오스 벨룸">카오스 벨룸</option>
                        <option value="카오스 반반">카오스 반반</option>
                        <option value="카오스 블러디 퀸">카오스 블러디 퀸</option>
                        <option value="카오스 피에르">카오스 피에르</option>
                        <option value="하드 매그너스">하드 매그너스</option>
                        <option value="카오스 자쿰">카오스 자쿰</option>
                        <option value="카오스 핑크빈">카오스 핑크빈</option>
                        <option value="시그너스">시그너스 (노멀/이지)</option>
                    </optgroup>
                </select>
            </div>

            <div class="list-title">등록된 일정 리스트</div>
            <div class="modal-schedule-list" id="modal-schedule-list">
                </div>

            <div class="modal-buttons">
                <button class="btn-close" onclick="closeModal()">닫기</button>
                <button class="btn-save" onclick="saveSchedule()">추장/등록</button>
            </div>
        </div>
    </div>

    <script>
        // --- [State] 애플리케이션 전역 상태 데이터 ---
        let currentDate = new Date(); 
        let selectedDateStr = "";      
        
        // [구조 수정] 이제 각 날짜 키값은 객체가 아니라 객체들을 담은 '배열 []'을 가집니다.
        let schedules = JSON.parse(localStorage.getItem('maple-calendar-schedules')) || {};

        const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];

        // --- [Logic] 대한민국 공휴일 연산 및 대체공휴일 계산 함수 ---
        function getSolarHolidays(year) {
            const holidays = {
                "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
                "08-15": "광복절", "10-01": "국군의 날", "10-03": "개천절", "10-09": "한글날", "12-25": "크리스마스"
            };

            if (year === 2025) {
                Object.assign(holidays, {"01-28":"설날", "01-29":"설날", "01-30":"설날", "05-05":"석가탄신일", "10-05":"추석", "10-06":"추석", "10-07":"추석", "10-08":"대체공휴일"});
            } else if (year === 2026) {
                Object.assign(holidays, {"02-16":"설날", "02-17":"설날", "02-18":"설날", "05-24":"석가탄신일", "05-25":"대체공휴일", "09-24":"추석", "09-25":"추석", "09-26":"추석", "09-28":"대체공휴일"});
            } else if (year === 2027) {
                Object.assign(holidays, {"02-06":"설날", "02-07":"설날", "02-08":"설날", "02-09":"대체공휴일", "05-13":"석가탄신일", "09-14":"추석", "09-15":"추석", "09-16":"추석"});
            }

            const targetSubstituteHolidays = ["01-01", "03-01", "05-05", "08-15", "10-01", "10-03", "10-09", "12-25"];
            targetSubstituteHolidays.forEach(md => {
                const [m, d] = md.split("-").map(Number);
                const holidayDate = new Date(year, m - 1, d);
                const day = holidayDate.getDay();

                if (day === 0 || day === 6) { 
                    let subDate = new Date(year, m - 1, d);
                    while (true) {
                        subDate.setDate(subDate.getDate() + 1); 
                        const subMd = `${String(subDate.getMonth() + 1).padStart(2, '0')}-${String(subDate.getDate()).padStart(2, '0')}`;
                        const subDay = subDate.getDay();
                        if (subDay !== 0 && subDay !== 6 && !holidays[subMd]) {
                            holidays[subMd] = "대체공휴일";
                            break;
                        }
                    }
                }
            });
            return holidays;
        }

        // --- [View] 달력 화면 그리기(렌더링) 함수 ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('month-display').innerText = `${year}년 ${String(month + 1).padStart(2, '0')}월`;

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = ''; 

            dayLabels.forEach(day => {
                const labelDiv = document.createElement('div');
                labelDiv.className = 'day-label';
                labelDiv.innerText = day;
                grid.appendChild(labelDiv);
            });

            const firstDayOfMonth = new Date(year, month, 1).getDay(); 
            const lastDateOfMonth = new Date(year, month + 1, 0).getDate(); 
            const holidays = getSolarHolidays(year); 

            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-cell empty';
                grid.appendChild(emptyCell);
            }

            const today = new Date();
            for (let date = 1; date <= lastDateOfMonth; date++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';
                
                const currentCellDate = new Date(year, month, date);
                const dayOfWeek = currentCellDate.getDay();

                if (dayOfWeek === 0) cell.classList.add('sunday');
                if (dayOfWeek === 6) cell.classList.add('saturday');

                if (year === today.getFullYear() && month === today.getMonth() && date === today.getDate()) {
                    cell.classList.add('today');
                }

                const monthStr = String(month + 1).padStart(2, '0');
                const dateStr = String(date).padStart(2, '0');
                const holidayKey = `${monthStr}-${dateStr}`;
                const fullDateStr = `${year}-${monthStr}-${dateStr}`;
                
                const cellTop = document.createElement('div');
                cellTop.className = 'cell-top';

                const dateNumDiv = document.createElement('div');
                dateNumDiv.className = 'date-num';
                dateNumDiv.innerText = date;
                cellTop.appendChild(dateNumDiv);

                if (holidays[holidayKey]) {
                    cell.classList.add('holiday');
                    const holidayLabel = document.createElement('div');
                    holidayLabel.className = 'holiday-label';
                    holidayLabel.innerText = holidays[holidayKey];
                    cellTop.appendChild(holidayLabel);
                }
                cell.appendChild(cellTop);

                const schedContainer = document.createElement('div');
                schedContainer.className = 'schedule-container';
                
                // [수정된 렌더링 로직] 배열 안에 든 '모든' 일정을 순회하며 뱃지를 다 생성함
                if (schedules[fullDateStr] && schedules[fullDateStr].length > 0) {
                    schedules[fullDateStr].forEach(item => {
                        const badge = document.createElement('div');
                        badge.className = 'party-badge';
                        badge.innerText = `[${item.party}] ${item.boss}`;
                        schedContainer.appendChild(badge);
                    });
                }
                cell.appendChild(schedContainer);

                cell.addEventListener('click', () => openModal(fullDateStr));
                grid.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar(); 
        }

        // --- [Modal & Data Control] 다중 일정 제어 로직 ---
        
        // 모달 내부에 현재 날짜에 쌓여있는 일정 리스트업 렌더링
        function updateModalScheduleList() {
            const listContainer = document.getElementById('modal-schedule-list');
            listContainer.innerHTML = '';

            const list = schedules[selectedDateStr] || [];

            if (list.length === 0) {
                listContainer.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:10px;">등록된 일정이 없습니다.</div>';
                return;
            }

            // 배열 내 일정을 하나씩 돌며 개별 삭제가 가능한 목록 인터페이스 구현
            list.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'schedule-item';
                itemDiv.innerHTML = `
                    <span><strong>[${item.party}]</strong> ${item.boss}</span>
                    <button class="btn-item-delete" onclick="deleteScheduleItem(${index})">×</button>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        // 모달창 오픈
        function openModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modal-date-title').innerText = `${dateStr} 일정 관리`;
            
            // 입력창들 비우기 및 초기화
            document.getElementById('party-name').value = '';
            document.getElementById('boss-name').value = '';

            // 쌓여있는 다중 일정 목록 로드
            updateModalScheduleList();

            document.getElementById('schedule-modal').style.display = 'flex';
        }

        // 모달창 닫기
        function closeModal() {
            document.getElementById('schedule-modal').style.display = 'none';
        }

        // 일정 누적 추가 및 저장 (배열에 push)
        function saveSchedule() {
            const party = document.getElementById('party-name').value.trim();
            const boss = document.getElementById('boss-name').value;

            if (!party || !boss) {
                alert('파티명과 보스명을 모두 입력/선택해주세요!');
                return;
            }

            // 해당 날짜에 데이터 배열이 없으면 새로 생성 후 push
            if (!schedules[selectedDateStr]) {
                schedules[selectedDateStr] = [];
            }
            
            schedules[selectedDateStr].push({ party, boss });
            localStorage.setItem('maple-calendar-schedules', JSON.stringify(schedules));
            
            // 입력창 비우고 모달 내부 목록 및 배경 달력 갱신 (열린 상태 유지하여 연속 등록 유도)
            document.getElementById('party-name').value = '';
            document.getElementById('boss-name').value = '';
            updateModalScheduleList();
            renderCalendar();
        }

        // 특정 순번(index)의 개별 일정 삭제 함수
        function deleteScheduleItem(index) {
            if (confirm('선택한 보스 일정을 삭제하시겠습니까?')) {
                schedules[selectedDateStr].splice(index, 1); // 해당 인덱스 요소 제거

                // 해당 날짜에 일정이 아예 없으면 키 자체를 지워 데이터 정리
                if (schedules[selectedDateStr].length === 0) {
                    delete schedules[selectedDateStr];
                }

                localStorage.setItem('maple-calendar-schedules', JSON.stringify(schedules));
                updateModalScheduleList();
                renderCalendar();
            }
        }

        window.onload = function() {
            // [데이터 마이그레이션 예외처리] 만약 기존에 단일 객체형태{}로 저장된 구버전 데이터가 있다면 초기화하여 충돌 방지
            for (let key in schedules) {
                if (schedules[key] && !Array.isArray(schedules[key])) {
                    schedules = {};
                    localStorage.setItem('maple-calendar-schedules', JSON.stringify(schedules));
                    break;
                }
            }
            renderCalendar();
        };
    </script>
</body>
</html>
